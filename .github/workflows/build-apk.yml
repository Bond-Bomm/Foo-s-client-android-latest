name: Build Foo Client APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fix AndroidManifest exported attribute if missing
        run: |
          MANIFEST="android/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android:exported" "$MANIFEST"; then
            sed -i 's/<activity /<activity android:exported="true" /g' "$MANIFEST"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Foos-Client-Android
          path: android/build/outputs/apk/debug/*.apk
          
